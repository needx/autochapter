<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Capítulos - OBS</title>
    <style>
        :root {
            --bg-color: #1e1e2e;
            --panel-bg: #282a36;
            --text-color: #f8f8f2;
            --primary: #bd93f9;
            --success: #50fa7b;
            --danger: #ff5555;
            --border: #44475a;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            height: 100vh;
            box-sizing: border-box;
        }

        .panel {
            background-color: var(--panel-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        h2 {
            margin-top: 0;
            color: var(--primary);
            border-bottom: 1px solid var(--border);
            padding-bottom: 10px;
        }

        /* Formulários */
        .form-group {
            margin-bottom: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 5px;
            color: #ccc;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--bg-color);
            color: var(--text-color);
            box-sizing: border-box;
        }

        button {
            background-color: var(--primary);
            color: #fff;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            transition: 0.2s;
        }

        button:hover {
            filter: brightness(1.1);
        }

        .btn-save {
            background-color: var(--success);
            color: #1e1e2e;
            margin-bottom: 20px;
        }

        /* Lista de Botões */
        .btn-list {
            flex-grow: 1;
            margin-top: 20px;
        }

        .btn-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-color);
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }

        .btn-item button {
            background-color: var(--danger);
            width: auto;
            padding: 5px 10px;
            color: white;
        }

        /* Logs */
        .log-container {
            background: var(--bg-color);
            flex-grow: 1;
            padding: 15px;
            border-radius: 4px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 14px;
        }

        .log-line {
            margin-bottom: 8px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }
    </style>
</head>

<body>

    <!-- Lado Esquerdo: Gerenciamento de Botões e Configurações -->
    <div class="panel">
        <h2>YouTube</h2>
        <button id="btnYouTube" onclick="vincularYouTube()" style="background: #ff0000; margin-bottom: 10px;">
            🔴 Vincular Conta YouTube
        </button>
        <div id="youtubeStatus" style="font-size: 0.8em; margin-bottom: 20px; color:#aaa; text-align: center;"></div>

        <h2>⚙️ Conexão e Servidor</h2>
        <div class="form-grid">
            <div class="form-group" style="margin-bottom: 0;">
                <label>IP do OBS</label>
                <input type="text" id="configIp" placeholder="127.0.0.1">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Porta do OBS</label>
                <input type="number" id="configPortaObs" placeholder="4455">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Usuário do OBS</label>
                <input type="text" id="configUser" placeholder="(Opcional no OBS v5)">
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Senha do OBS</label>
                <input type="password" id="configSenha">
            </div>
            <div class="form-group" style="margin-bottom: 0; grid-column: span 2;">
                <label>Porta do Servidor (Aplicativo)</label>
                <input type="number" id="configPortaApp" placeholder="3000">
            </div>
            <div class="form-group" style="margin-bottom: 0; grid-column: span 2;">
                <label>URL do Plugin Holyrics (HTML)</label>
                <input type="text" id="configHolyrics" placeholder="http://localhost:80/view/text">
            </div>
        </div>
        <button class="btn-save" onclick="salvarConfiguracoes()">💾 Salvar Configurações</button>

        <h2>🛠️ Criar Botões do OBS</h2>
        <div class="form-grid">
            <div class="form-group" style="position: relative;">
                <label>Ícone</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="novoIcone" placeholder="📌" maxlength="2"
                        style="width: 60px; text-align: center; font-size: 18px;">
                    <!-- Botão para abrir o teclado -->
                    <button type="button" id="btnEmoji"
                        style="cursor: pointer; background: #3b82f6; border: none; border-radius: 4px; padding: 0 15px; font-size: 18px; color: white; transition: background 0.2s;"
                        onmouseover="this.style.backgroundColor='#2563eb'"
                        onmouseout="this.style.backgroundColor='#3b82f6'">
                        😀
                    </button>
                </div>

                <!-- Teclado de Emojis Oculto -->
                <div id="emojiPicker"
                    style="display: none; position: absolute; top: 75px; left: 0; background: #2b2b2b; border: 1px solid #444; border-radius: 8px; padding: 10px; width: 220px; grid-template-columns: repeat(5, 1fr); gap: 5px; z-index: 100; box-shadow: 0 8px 16px rgba(0,0,0,0.5);">
                    <!-- Emojis serão gerados aqui pelo JavaScript -->
                </div>
            </div>
            <div class="form-group" style="margin-bottom: 0;">
                <label>Nome no Botão</label>
                <input type="text" id="btnLabel" placeholder="Ex: Pregação">
            </div>
        </div>
        <div class="form-group">
            <label>Título Real no YouTube</label>
            <input type="text" id="btnTitle" placeholder="Ex: Início da Pregação da Palavra">
        </div>
        <button onclick="adicionarBotao()">Adicionar Botão</button>

        <div class="btn-list" id="botoesSalvos">
            <!-- Botões aparecerão aqui -->
        </div>
    </div>

    <!-- Lado Direito: Visualização em Tempo Real -->
    <div class="panel">
        <div
            style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 10px;">
            <h2 style="margin: 0; border: none; padding: 0;">⏱️ Capítulos Registrados</h2>
            <button onclick="abrirJanelaLogs()"
                style="width: auto; background-color: #44475a; padding: 6px 12px; font-size: 12px; border-radius: 4px;">📄
                logs</button>
        </div>
        <div class="log-container" id="logContainer">
            <div style="color: #6272a4;">Aguardando o início da transmissão no OBS...</div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');
        let botoes = [];

        // --- INTEGRAÇÃO YOUTUBE ---
        function vincularYouTube() {
            const statusDiv = document.getElementById('youtubeStatus');
            statusDiv.innerHTML = "Aguardando login no navegador...";
            ipcRenderer.send('vincular-youtube');
        }

        ipcRenderer.on('youtube-status', (event, response) => {
            const statusDiv = document.getElementById('youtubeStatus');
            if (response.success) {
                statusDiv.innerHTML = '<span style="color:#50fa7b;">✅ Conta vinculada com sucesso!</span>';
            } else {
                statusDiv.innerHTML = `<span style="color:#ff5555;">❌ Erro: ${response.message}</span>`;
            }
        });

        // --- CONFIGURAÇÕES DE SERVIDOR E OBS ---
        async function inicializar() {
            try {
                // Solicita os dados do main.js
                const dados = await ipcRenderer.invoke('obter-dados-store');

                document.getElementById('configIp').value = dados.obsIp || '127.0.0.1';
                document.getElementById('configPortaObs').value = dados.obsPort || '4455';
                document.getElementById('configUser').value = dados.obsUser || '';
                document.getElementById('configSenha').value = dados.obsPassword || '';
                document.getElementById('configPortaApp').value = dados.appPort || '3000';
                document.getElementById('configHolyrics').value = dados.holyricsUrl || 'http://localhost:80/view/text';

                botoes = dados.botoes || [];
                renderizarBotoes();
            } catch (error) {
                console.error("Erro ao carregar configurações:", error);
            }
        }

        function salvarConfiguracoes() {
            const config = {
                obsIp: document.getElementById('configIp').value,
                obsPort: document.getElementById('configPortaObs').value,
                obsUser: document.getElementById('configUser').value,
                obsPassword: document.getElementById('configSenha').value,
                appPort: document.getElementById('configPortaApp').value,
                holyricsUrl: document.getElementById('configHolyrics').value
            };

            // Envia para o main.js salvar no banco
            ipcRenderer.send('salvar-configuracoes', config);
            alert('Configurações salvas com sucesso! O aplicativo tentará reconectar ao OBS.');
        }

        // --- GERENCIAMENTO DE BOTÕES ---
        function renderizarBotoes() {
            const container = document.getElementById('botoesSalvos');
            container.innerHTML = botoes.map((btn, index) => `
                <div class="btn-item">
                    <span>${btn.icone} <b>${btn.label}</b><br><small style="color:#aaa;">${btn.titulo}</small></span>
                    <button onclick="removerBotao(${index})">🗑️</button>
                </div>
            `).join('');
        }

        function adicionarBotao() {
            // Alterado de 'btnIcon' para 'novoIcone'
            const icone = document.getElementById('novoIcone').value || '📌';
            const label = document.getElementById('btnLabel').value;
            const titulo = document.getElementById('btnTitle').value;

            if (!label || !titulo) {
                alert('Preencha pelo menos o Nome do Botão e o Título!');
                return;
            }

            botoes.push({ id: 'btn_' + Date.now(), icone, label, titulo });
            salvarBotoes();

            // Alterado de 'btnIcon' para 'novoIcone'
            document.getElementById('novoIcone').value = '';
            document.getElementById('btnLabel').value = '';
            document.getElementById('btnTitle').value = '';
        }

        function removerBotao(index) {
            botoes.splice(index, 1);
            salvarBotoes();
        }

        function salvarBotoes() {
            // Envia para o main.js salvar no banco
            ipcRenderer.send('salvar-botoes', botoes);
            renderizarBotoes();
        }
        
        function abrirJanelaLogs() {
            ipcRenderer.send('abrir-janela-logs');
        }
        // --- LOGS EM TEMPO REAL ---
        ipcRenderer.on('novo-log', (event, log) => {
            const logContainer = document.getElementById('logContainer');
            if (logContainer.innerHTML.includes('Aguardando')) logContainer.innerHTML = '';

            const linha = document.createElement('div');
            linha.className = 'log-line';
            linha.innerText = log;
            logContainer.appendChild(linha);
            logContainer.scrollTop = logContainer.scrollHeight;
        });

        // ==========================================
        // TECLADO DE EMOJIS CUSTOMIZADO
        // ==========================================
        const listaEmojis = [
            "📌", "🎵", "📖", "🎤", "🎸", "🎹", "🥁", "🎬", "⛪", "🙏",
            "⚠️", "✅", "🔥", "💡", "💬", "🙋", "✝️", "🕊️", "⭐", "🔴",
            "🎥", "📱", "🎉", "👏", "🙌"
        ];

        const emojiPicker = document.getElementById('emojiPicker');
        const inputIcone = document.getElementById('novoIcone');
        const btnEmoji = document.getElementById('btnEmoji');

        // Constrói os botões de emoji dentro do painel
        emojiPicker.innerHTML = listaEmojis.map(emoji => `
    <div style="cursor: pointer; text-align: center; font-size: 20px; padding: 6px; border-radius: 4px; transition: background 0.2s;" 
         onmouseover="this.style.background='#4c4c4c'" 
         onmouseout="this.style.background='transparent'" 
         onclick="selecionarEmoji('${emoji}')">
        ${emoji}
    </div>
`).join('');

        // Abre/Fecha o teclado ao clicar no botão
        btnEmoji.addEventListener('click', (e) => {
            e.stopPropagation(); // Evita que o clique feche imediatamente
            const estaAberto = emojiPicker.style.display === 'grid';
            emojiPicker.style.display = estaAberto ? 'none' : 'grid';
        });

        // Função chamada ao clicar em um emoji
        function selecionarEmoji(emoji) {
            inputIcone.value = emoji;
            emojiPicker.style.display = 'none'; // Fecha após escolher
        }

        // Fecha o teclado se o usuário clicar em qualquer outro lugar da tela
        document.addEventListener('click', (e) => {
            if (!emojiPicker.contains(e.target) && e.target !== btnEmoji) {
                emojiPicker.style.display = 'none';
            }
        });

        // Carrega as informações ao abrir o painel
        inicializar();
    </script>
</body>

</html>
